<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<body background="{{ url_for('static',filename='resources/background.jpg') }}" style="width: 90%; align-items: center; margin-left: 5%;">
    <!--Smith Island Cake-->
    <!--button for creating new file-->

    <table class="table">

                    BUTTONS
                </td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <form>

                            edit title

                </td>

                </td>
            </tr>
            <tr>
                <td>
                    <form>
                        File 2

                    <button type="submit" class="btn btn-danger">Delete</button>
                </td>
            </tr>
            <tr>

                        <button class="btn btn-link">

                        </button>
                    </form>
                </td>
                <td>
                    Date Modfied
                </td>
                <td>
                    <form>
                        <input type="hidden" value="2">
                        <button type="submit" class="btn btn-primary" value="1">Edit</button>
                        <button type="submit" class="btn btn-danger" value="1">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for message in messages %}
                <div role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</body>
</html>
